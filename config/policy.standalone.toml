[governance]
policy_version = "1.0.0"
default_action = "deny"
input_hash_binding_required = true
max_grant_ttl_seconds = 30

[[rules]]
name = "Auto-allow read-only operations"
operation_kind = "read_only"
action = "allow"
priority = 10

[[rules]]
name = "Require approval for financial mutations"
operation_kind = "financial_mutation"
action = "require_approval"
min_amount_cents = 10000 # > $100.00 requires human approval
priority = 20

[[rules]]
name = "Deny high risk unauthenticated calls"
operation_kind = "destructive"
action = "deny"
priority = 30
