[package]
name = "trust-auth"
version = "0.1.0"
edition = "2021"
description = "Scoped JWT verifier and claims validator adhering to 010_JWT_CONTRACTS.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jwt-simple = { version = "0.12", default-features = false, features = ["pure-rust"] }
anyhow = "1.0"
