[package]
name = "trust-contract"
version = "0.1.0"
edition = "2021"
description = "Deterministic Negotiated Interaction Contract Protocol (NICP) domain kernel"

[dependencies]
trust-canonical = { path = "../trust-canonical" }
trust-model = { path = "../trust-model" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["chrono"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["sync"] }
ed25519-dalek = "2.1"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
