[package]
name = "trust-grants"
version = "0.1.0"
edition = "2021"
description = "Ed25519 ExecutionGrant issuance and verification"

[dependencies]
trust-model = { path = "../trust-model" }
trust-canonical = { path = "../trust-canonical" }
jwt-simple = { version = "0.12", default-features = false, features = ["pure-rust"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

