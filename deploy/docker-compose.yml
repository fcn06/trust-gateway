services:
  nats:
    image: nats:2.10-alpine
    container_name: trust-gateway-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 2s
      timeout: 2s
      retries: 5

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    container_name: trust-gateway-core
    environment:
      - NATS_URL=nats://nats:4222
      - GATEWAY_LISTEN=0.0.0.0:3060
      - POLICY_PATH=config/policy.toml
      - JWT_SECRET=dev-secret-do-not-use-in-production-1234567890
      - LIANXI_ENV=development
    ports:
      - "3060:3060"
    depends_on:
      nats:
        condition: service_healthy

  executor-host:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.executor
    container_name: trust-executor-host
    environment:
      - NATS_URL=nats://nats:4222
      - EXECUTOR_PROFILE=native-tool
      - JWT_SECRET=dev-secret-do-not-use-in-production-1234567890
      - LIANXI_ENV=development
    depends_on:
      nats:
        condition: service_healthy
