apiVersion: apps/v1
kind: Deployment
metadata:
  name: trust-gateway
  namespace: lianxi-system
  labels:
    app: trust-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trust-gateway
  template:
    metadata:
      labels:
        app: trust-gateway
    spec:
      containers:
        - name: trust-gateway
          image: lianxi/trust-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: trust-gateway-config
          ports:
            - containerPort: 3060
              name: http
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
