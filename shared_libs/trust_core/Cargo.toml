[package]
name = "trust_core"
version = "0.1.0"
edition = "2021"
description = "Canonical domain types and traits for the Sovereign Trust & Approval Gateway"

[lib]
crate-type = ["lib"]

[dependencies]
trust_verifier = { path = "../../verifier" }
trust-model = { path = "../../crates/trust-model" }
trust-canonical = { path = "../../crates/trust-canonical" }
trust-grants = { path = "../../crates/trust-grants" }
trust-audit = { path = "../../crates/trust-audit" }
trust-egress = { path = "../../crates/trust-egress" }
trust-executor-sdk = { path = "../../crates/trust-executor-sdk" }
serde = { version = "1.0", features = ["derive"] }

serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
schemars = { version = "0.8", features = ["chrono", "uuid1"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
jsonschema = "0.28"
regex = "1.10"
sha2 = "0.10"
jwt-simple = { version = "0.12", default-features = false, features = ["pure-rust"] }
tracing = "0.1"
toml = "0.8"


